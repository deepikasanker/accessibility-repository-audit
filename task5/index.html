<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task 5 - Dynamic REST API Client</title><link rel="stylesheet" href="css/styles.css"></head>
<body><header><p>RabTech Academy · Full Stack Web Development</p><h1>Dynamic Product Explorer</h1><p>Async JavaScript, REST API, filtering, sorting and client-side state.</p></header>
<main><section class="controls"><h2>Explore products</h2>
<div class="controls-grid"><label>Search<input id="searchInput" type="search" placeholder="Search products..."></label>
<label>Category<select id="categorySelect"><option value="all">All categories</option></select></label>
<label>Sort<select id="sortSelect"><option value="default">Default</option><option value="price-asc">Price: Low to High</option><option value="price-desc">Price: High to Low</option><option value="rating-desc">Rating: High to Low</option><option value="title-asc">Name: A to Z</option></select></label></div>
<div class="tabs" role="tablist"><button class="tab active" data-tab="all" role="tab" aria-selected="true">All</button><button class="tab" data-tab="favorites" role="tab" aria-selected="false">Favorites</button></div>
<p id="status" role="status" aria-live="polite">Loading products...</p></section>
<section><div class="results"><h2>Results</h2><span id="resultCount">0 products</span></div><div id="productGrid" class="grid"></div></section></main>
<footer><p>Task 5 demonstration · data loaded asynchronously from a public REST API.</p></footer>
<script type="module" src="js/app.js"></script></body></html>
